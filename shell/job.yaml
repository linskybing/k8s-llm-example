# Interactive shell with the n150 (like srun --pty bash). Holds the card until you delete it.
#   kubectl replace --force -f k8s-n150-example/shell/job.yaml
#   kubectl exec -it job/shell -- bash
#   kubectl delete job shell
apiVersion: batch/v1
kind: Job
metadata:
  name: shell
spec:
  template:
    spec:
      restartPolicy: Never
      resourceClaims:
        - {name: n150, resourceClaimTemplateName: n150}
      containers:
        - name: shell
          image: ghcr.io/tenstorrent/tt-metal/tt-metalium-ubuntu-22.04-release-amd64:v0.79.0
          command: [sleep, infinity]
