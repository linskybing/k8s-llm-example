# Your own vLLM (~/vllm at v0.32.0, Python changes) on one MI210, OpenAI API on port 8000. See mi210/README.md.
#   kubectl replace --force -f k8s-llm-example/mi210/vllm-custom.yaml
#   kubectl port-forward job/mi210-vllm-custom 8000:8000 &   then python3 k8s-llm-example/chat.py "Hi"
#   kubectl delete job mi210-vllm-custom
apiVersion: batch/v1
kind: Job
metadata:
  name: mi210-vllm-custom
spec:
  template:
    metadata:
      labels:
        n150/metrics: "true"           # exporter/podmonitor.yaml scrapes /metrics
    spec:
      restartPolicy: Never
      resourceClaims:
        - {name: gpu, resourceClaimTemplateName: mi210}
      containers:
        - name: vllm
          image: vllm/vllm-openai-rocm:v0.32.0   # ~/vllm must be checked out at the same version (v0.32.0)
          command: [bash, -c]
          args:
            - |
              set -e
              # ~/vllm has no compiled kernels: take them (and other build outputs) from the image's v0.32.0 install.
              # cp -n never overwrites your files; the .so files and vllm-rs are always refreshed from the image.
              D=$(cd / && python3 -c 'import vllm, os; print(os.path.dirname(vllm.__file__))')
              cp -rn "$D"/. ~/vllm/vllm/ && cp -f "$D"/*.so "$D"/vllm-rs ~/vllm/vllm/
              export PYTHONPATH=$HOME/vllm
              exec vllm serve meta-llama/Llama-3.2-1B-Instruct --port 8000
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef: {name: hf-token, key: token}
          ports:
            - {name: metrics, containerPort: 8000}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
          resources:
            claims: [{name: gpu}]
