# LLM server on MI210 (vLLM, OpenAI API on port 8000). Model downloads are cached in your home (~/.cache/huggingface).
#   kubectl replace --force -f k8s-llm-example/mi210/vllm.yaml
#   kubectl get pods                         READY 1/1 when the model is loaded
#   kubectl port-forward job/mi210-vllm 8000:8000 &
#   python3 k8s-llm-example/chat.py "Hi"
#   kubectl delete job mi210-vllm             free the GPU
# 4 GPUs: resourceClaimTemplateName: mi210x4 (kubectl apply -f k8s-llm-example/mi210/mi210x4.yaml) and --tensor-parallel-size 4
apiVersion: batch/v1
kind: Job
metadata:
  name: mi210-vllm
spec:
  template:
    spec:
      restartPolicy: Never
      resourceClaims:
        - {name: gpu, resourceClaimTemplateName: mi210}
      containers:
        - name: vllm
          image: vllm/vllm-openai-rocm:v0.32.0
          command: [vllm, serve, meta-llama/Llama-3.2-1B-Instruct, --port, "8000", --tensor-parallel-size, "1"]
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef: {name: hf-token, key: token}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
          resources:
            claims: [{name: gpu}]
          volumeMounts:
            - {name: shm, mountPath: /dev/shm}   # tensor parallel workers talk over shared memory
      volumes:
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 16Gi}
