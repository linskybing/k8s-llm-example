# Interactive shell with the n150 (like srun --pty bash). Holds the card until you delete it.
#   kubectl replace --force -f k8s-llm-example/n150/shell.yaml
#   kubectl exec -it job/n150-shell -- bash
#   kubectl delete job n150-shell
apiVersion: batch/v1
kind: Job
metadata:
  name: n150-shell
spec:
  template:
    spec:
      restartPolicy: Never
      resourceClaims:
        - {name: n150, resourceClaimTemplateName: n150}
      containers:
        - name: shell
          image: ghcr.io/tenstorrent/tt-metal/tt-metalium-ubuntu-22.04-release-amd64:v0.79.0
          workingDir: /home/<you>        # your home, mounted below (hostPath): same files as over SSH
          command: [sleep, infinity]
          env:
            - {name: HOME, value: /home/<you>}
          volumeMounts:
            - {name: home, mountPath: /home/<you>}
      volumes:
        - {name: home, hostPath: {path: /home/<you>, type: Directory}}
